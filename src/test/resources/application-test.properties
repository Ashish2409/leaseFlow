# Testcontainers manages the datasource — Spring Boot auto-configures from the @DynamicPropertySource
# These are fallback values; tests override them via @DynamicPropertySource in base class.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# JWT — short expiry for tests
jwt.secret=test-secret-key-that-is-long-enough-for-hs256-algorithm-yes-it-is
jwt.access-token-expiry-ms=60000
jwt.refresh-token-expiry-ms=120000

# Silence noisy logs in tests
logging.level.org.flywaydb=WARN
logging.level.org.springframework.security=WARN
logging.level.com.abm.leaseflow=INFO

# Swagger off in tests
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
