#  DataSource (all values must come from environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

#  JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#  Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#  JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

#  Logging
logging.level.com.abm.leaseflow=INFO
logging.level.org.springframework.security=WARN

#  Swagger (disabled in production by default)
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
